<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Example WebGL build — Solara Games</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080d;
      --surface: #101320;
      --border: rgba(255, 255, 255, .09);
      --text: #eef1fb;
      --muted: #9aa4bf;
      --brand: #ffc857;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(60% 70% at 50% 0%, rgba(255, 200, 87, .12), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 520px;
      padding: 36px 30px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--brand);
    }

    h1 { margin: 0 0 12px; font-size: 1.4rem; }

    p { margin: 0 0 12px; color: var(--muted); line-height: 1.65; font-size: .95rem; }

    code {
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .07);
      font-size: .85em;
    }
  </style>
</head>

<body>
  <div class="card">
    <span class="badge">Placeholder build</span>
    <h1>Your Unity WebGL game goes here</h1>
    <p>
      Replace the contents of <code>unity-games/example-game/</code> with the output of a Unity WebGL build,
      keeping <code>index.html</code> at the top of the folder.
    </p>
    <p>
      Then edit <code>data/unity-games.json</code> — or delete this folder and its entry once you have real games.
    </p>
  </div>
</body>

</html>
